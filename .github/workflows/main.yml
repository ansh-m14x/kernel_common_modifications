name: Build Custom Kernel

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

            - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            gcc-multilib \
            g++-multilib \
            libc6-dev \
            libc6-dev-i386 \
            linux-libc-dev \
            bc \
            bison \
            flex \
            libssl-dev \
            libncurses-dev \
            kmod \
            cpio \
            libelf-dev \
            lld \
            llvm


      - name: Run Kernel Build Script
        run: |
          chmod +x build_kernel.sh
          ./build_kernel.sh

      - name: Upload Kernel Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kernel-build-output
          path: |
            arch/arm64/boot/Image*
            arch/arm64/boot/dts/
